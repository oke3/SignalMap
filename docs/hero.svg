<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="55%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#05070b"/>
    </radialGradient>
    <linearGradient id="glow-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-b" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11161f"/>
      <stop offset="100%" stop-color="#0c111a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#58a6ff" stroke-width="0.5">
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none"/>
    </pattern>
  </g>
  <rect width="800" height="400" fill="url(#grid)"/>

  <!-- Glows -->
  <ellipse cx="100" cy="50" rx="300" ry="300" fill="url(#glow-a)"/>
  <ellipse cx="700" cy="350" rx="300" ry="300" fill="url(#glow-b)"/>

  <!-- Editor window -->
  <rect x="40" y="30" width="720" height="340" rx="14" fill="#0b0f17" stroke="#1d2733" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="40" y="30" width="720" height="40" rx="14" fill="url(#titlebar)"/>
  <rect x="40" y="56" width="720" height="14" fill="url(#titlebar)"/>
  <rect x="40" y="56" width="720" height="1" fill="#1b2430"/>

  <!-- Dots -->
  <circle cx="64" cy="50" r="6" fill="#ff5f57"/>
  <circle cx="82" cy="50" r="6" fill="#febc2e"/>
  <circle cx="100" cy="50" r="6" fill="#28c840"/>

  <!-- Filename -->
  <text x="120" y="55" fill="#8b98a9" font-family="monospace" font-size="12">signalmap.sh <tspan fill="#d6e2f0">— Tech News Directory</tspan></text>

  <!-- Gutter line numbers -->
  <g fill="#828c9b" font-family="monospace" font-size="12" text-anchor="end">
    <text x="75" y="95">1</text>
    <text x="75" y="115">2</text>
    <text x="75" y="135">3</text>
    <text x="75" y="155">4</text>
  </g>

  <!-- Code lines -->
  <!-- Line 1: const signalmap = await fetch("https://oke3.github.io/SignalMap/outlets.json") -->
  <text x="86" y="95" font-family="monospace" font-size="13">
    <tspan fill="#f97583">const</tspan>
    <tspan fill="#e1e4e8"> </tspan>
    <tspan fill="#79b8ff">signalmap</tspan>
    <tspan fill="#e1e4e8"> </tspan>
    <tspan fill="#f97583">=</tspan>
    <tspan fill="#e1e4e8"> </tspan>
    <tspan fill="#f97583">await</tspan>
    <tspan fill="#e1e4e8"> </tspan>
    <tspan fill="#b392f0">fetch</tspan>
    <tspan fill="#e1e4e8">(</tspan>
    <tspan fill="#9ecbff">"…/SignalMap/outlets.json"</tspan>
    <tspan fill="#e1e4e8">)</tspan>
  </text>

  <!-- Line 2: const { outlets, count } = await signalmap.json() -->
  <text x="86" y="115" font-family="monospace" font-size="13">
    <tspan fill="#f97583">const</tspan>
    <tspan fill="#e1e4e8"> </tspan>
    <tspan fill="#79b8ff">{ outlets, count }</tspan>
    <tspan fill="#e1e4e8"> </tspan>
    <tspan fill="#f97583">=</tspan>
    <tspan fill="#e1e4e8"> </tspan>
    <tspan fill="#f97583">await</tspan>
    <tspan fill="#e1e4e8"> </tspan>
    <tspan fill="#79b8ff">signalmap</tspan>
    <tspan fill="#e1e4e8">.</tspan>
    <tspan fill="#b392f0">json</tspan>
    <tspan fill="#e1e4e8">()</tspan>
  </text>

  <!-- Line 3: console.log(`📡 ${count} outlets · 36 verticals`) -->
  <text x="86" y="135" font-family="monospace" font-size="13">
    <tspan fill="#79b8ff">console</tspan>
    <tspan fill="#e1e4e8">.</tspan>
    <tspan fill="#b392f0">log</tspan>
    <tspan fill="#e1e4e8">(</tspan>
    <tspan fill="#9ecbff">`📡 ${count} outlets · 36 verticals`</tspan>
    <tspan fill="#e1e4e8">)</tspan>
  </text>

  <!-- Line 4: Comment -->
  <text x="86" y="155" font-family="monospace" font-size="13" fill="#6a737d">
    <tspan>// SignalMap — Tech News Directory</tspan>
  </text>

  <!-- Blinking cursor -->
  <rect x="340" y="148" width="3" height="14" rx="1" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom stats bar -->
  <rect x="40" y="360" width="720" height="10" fill="#0c111a" rx="0 0 14 14"/>
  <text x="60" y="368" fill="#415062" font-family="monospace" font-size="9">Built with HyperFrames · 640+ outlets · 36 verticals</text>
</svg>
